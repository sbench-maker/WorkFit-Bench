services:
  api:
    build: .
    environment:
      DATABASE_URL: <REDACTED>
    depends_on: [db]
  worker:
    build: .
    command: ["uv", "run", "python", "-m", "rosterly.worker"]
    environment:
      DATABASE_URL: <REDACTED>
    depends_on: [db]
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: rosterly
      POSTGRES_HOST_AUTH_METHOD: trust
