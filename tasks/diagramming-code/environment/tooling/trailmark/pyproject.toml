[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "trailmark"
version = "0.2.0"
description = "Offline AST-backed Trailmark compatibility runtime for the SkillsBench fixture"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
trailmark = "trailmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
