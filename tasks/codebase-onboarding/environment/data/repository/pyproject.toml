[project]
name = "rosterly-api"
version = "0.8.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn>=0.30,<0.31",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<3.3",
  "pydantic-settings>=2.5,<2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<8.4", "httpx>=0.27,<0.28", "ruff>=0.6,<0.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
